name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Typecheck
        run: pnpm check

      - name: Generate Android project
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --clean

      # Important: setup-java must run after expo prebuild if Gradle caching is enabled,
      # because prebuild is what creates android/*.gradle and gradle-wrapper.properties.
      # Cache is intentionally disabled here for maximum CI reliability.
      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Build release APK locally
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Collect APK
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK" ]; then
            echo "Release APK was not found at $APK"
            find android/app/build/outputs -type f -name '*.apk' -print || true
            exit 1
          fi
          cp "$APK" allergy-guard-android.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: allergy-guard-android-apk
          path: allergy-guard-android.apk
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: allergy-guard-android.apk
          body: |
            نسخة Android أولية من حارس الحساسية.
            - APK مبني مباشرة داخل GitHub Actions بدون الحاجة إلى حساب Expo/EAS.
            - إضافة وإدارة الأدوية والحساسيات (عرض، تعديل، حذف).
            - تصدير جميع السجلات إلى PDF أو CSV/Excel.
            - التطبيق يحفظ السجلات محليًا على الجهاز.
            - هذه نسخة تجريبية وليست بديلًا عن استشارة الطبيب.
