name: Android preview APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm check
      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build preview APK
        run: |
          eas build --platform android --profile preview --non-interactive --wait
          eas build:list --platform android --status finished --build-profile preview --git-commit-hash "$GITHUB_SHA" --limit 1 --json > build.json
          node -e "const fs=require('fs'); const d=JSON.parse(fs.readFileSync('build.json','utf8')); const url=d[0]?.artifacts?.buildUrl; if(!url) { console.error('No finished EAS build matched'); process.exit(1); } fs.writeFileSync('build-url.txt', url);"
          BUILD_URL=$(cat build-url.txt)
          if [ -z "$BUILD_URL" ]; then echo "Failed to extract build URL"; exit 1; fi
          curl -L "$BUILD_URL" -o allergy-guard-android.apk
          if [ ! -f allergy-guard-android.apk ]; then echo "Failed to download APK"; exit 1; fi
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: allergy-guard-android-apk
          path: allergy-guard-android.apk
      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: allergy-guard-android.apk
          body: |
            نسخة Android أولية من حارس الحساسية.
            - التطبيق يعمل محليًا ويحفظ السجلات على الجهاز.
            - هذه نسخة تجريبية وليست بديلًا عن استشارة الطبيب.
