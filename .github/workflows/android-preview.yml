name: Android build

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  build-android:
    name: Build Android APK + AAB
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      EXPO_PUBLIC_GITHUB_REPOSITORY: ${{ github.repository }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
          run_install: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify required packages
        run: |
          node -e "require.resolve('expo-print/package.json'); require.resolve('expo-crypto/package.json'); require.resolve('expo-mail-composer/package.json'); require.resolve('expo-sharing/package.json'); require.resolve('expo-notifications/package.json'); require.resolve('expo-secure-store/package.json'); console.log('required packages are installed')"

      - name: Verify package and app versions
        run: |
          set -euo pipefail
          PKG_VERSION=$(node -p "require('./package.json').version")
          APP_VERSION=$(node -e "const fs=require('fs');const s=fs.readFileSync('app.config.ts','utf8');const m=s.match(/const version = \"([^\"]+)\"/);if(!m)process.exit(2);process.stdout.write(m[1]);")
          test "$PKG_VERSION" = "$APP_VERSION" || { echo "ERROR: package.json version ($PKG_VERSION) != app.config.ts version ($APP_VERSION)"; exit 1; }
          echo "Version guard passed: $APP_VERSION"

      - name: Verify simple email backup mode
        run: |
          set -euo pipefail
          if grep -RIn --include='*.ts' --include='*.tsx' \
            -E 'expo-background-task|expo-task-manager|react-native-nitro-google-signin|react-native-nitro-modules' \
            app components hooks lib; then
            echo "ERROR: legacy OAuth/background-mail dependency import found."
            exit 1
          fi
          echo "Simple email-backup dependency guard passed."

      - name: Verify Android-safe cryptographic RNG
        run: |
          set -euo pipefail
          grep -RIn --include='*.ts' --include='*.tsx' 'expo-crypto' lib/email-backup.ts lib/backup-crypto.ts > /dev/null
          if grep -RIn --include='*.ts' --include='*.tsx' 'nacl\.randomBytes' app components hooks lib; then
            echo "ERROR: TweetNaCl PRNG usage found. Android must use expo-crypto native RNG."
            exit 1
          fi
          echo "Native Android cryptographic RNG guard passed."


      - name: Verify backup KDF compatibility
        run: |
          set -euo pipefail
          grep -q 'const CURRENT_ITERATIONS = 20_000' lib/email-backup.ts
          grep -q 'envelope.iterations' lib/email-backup.ts
          grep -q 'parsed.iterations' lib/backup-crypto.ts
          echo "Backup KDF compatibility guard passed."

      - name: Typecheck
        run: pnpm check

      - name: Validate Expo config
        run: pnpm exec expo config --type public > /dev/null

      - name: Generate Android project
        env:
          CI: '1'
        run: pnpm exec expo prebuild --platform android --clean

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepare stable Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD_SECRET: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS_SECRET: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD_SECRET: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail

          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            KEYSTORE_PATH="$RUNNER_TEMP/allergy-guard-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"
            echo "ANDROID_KEYSTORE_PASSWORD=$ANDROID_KEYSTORE_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_ALIAS=$ANDROID_KEY_ALIAS_SECRET" >> "$GITHUB_ENV"
            echo "ANDROID_KEY_PASSWORD=$ANDROID_KEY_PASSWORD_SECRET" >> "$GITHUB_ENV"
            echo "Stable release signing is configured."
          else
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              echo "ERROR: production/tag builds require stable signing secrets."
              echo "Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS and ANDROID_KEY_PASSWORD in GitHub Actions secrets."
              exit 1
            fi
            echo "ALLOW_DEBUG_RELEASE_SIGNING=1" >> "$GITHUB_ENV"
            echo "WARNING: preview build only; stable release signing secrets are not configured."
          fi

      - name: Configure Android signing
        run: node scripts/configure-android-signing.js

      - name: Build release APK and Play Store AAB
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease :app:bundleRelease --no-daemon --stacktrace

      - name: Collect Android artifacts
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          AAB="android/app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK" || { echo "APK not found"; exit 1; }
          test -f "$AAB" || { echo "AAB not found"; exit 1; }
          cp "$APK" allergy-guard-android.apk
          cp "$AAB" allergy-guard-play-store.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allergy-guard-android
          path: |
            allergy-guard-android.apk
            allergy-guard-play-store.aab
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            allergy-guard-android.apk
            allergy-guard-play-store.aab
          body: |
            نسخة Android موقعة من حارس الحساسية.
            - APK للتثبيت المباشر.
            - AAB مخصص للرفع إلى Google Play.
            - الحفاظ على نفس package name وversionCode تصاعدي يسمح بالتحديث فوق النسخة السابقة عند استخدام نفس مفتاح التوقيع.
            - بيانات المرضى والسجلات المحلية تبقى محفوظة أثناء التحديث العادي للتطبيق.
